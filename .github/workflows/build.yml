name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Changed back to standard build task now that Java environments match
      - name: Build with Global Gradle
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "NO build.gradle FOUND"; exit 1; fi
          cd "$(dirname "$F")"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mace-keys-mod
          path: "**/build/libs/*.jar"
