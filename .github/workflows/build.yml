name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Java (Using Java 21, the modern standard for recent Minecraft versions)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Setup Gradle (This action automatically handles caching)
      - uses: gradle/actions/setup-gradle@v4

      # 3. Grant execute permissions to the wrapper and run the build
      - name: Build with Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      # 4. Upload the compiled jar artifact
      - uses: actions/upload-artifact@v4
        with:
          name: mace-keys-mod
          path: "**/build/libs/*.jar"
